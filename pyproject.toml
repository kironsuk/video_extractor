[build-system]
requires = ["setuptools>=68.0", "setuptools-scm>=8.0"]
build-backend = "setuptools.build_meta"

[project]
name = "video-extractor"
version = "0.1.0"
description = "Extract video from physical DVDs on macOS"
requires-python = ">=3.10"
dependencies = [
    "click>=8.0",
    "rich>=13.0",
]

[project.scripts]
dvdrip = "video_extractor.cli:cli"

[tool.setuptools.packages.find]
where = ["src"]
